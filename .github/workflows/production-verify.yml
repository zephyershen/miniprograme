name: production-verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.15.0", "20.19.5", "24.14.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            hyyc/cloudfunctions/knowledgeFeed/package-lock.json
            hyyc/cloudfunctions/knowledgeOps/package-lock.json
            hyyc/cloudfunctions/membershipBilling/package-lock.json
            hyyc/cloudrun/source-preview-renderer/package-lock.json
            hyyc/cloudrun/source-preview-renderer/docker/package-lock.json
      - name: Reproduce test dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            hyyc/cloudfunctions/knowledgeFeed \
            hyyc/cloudfunctions/knowledgeOps \
            hyyc/cloudfunctions/membershipBilling \
            hyyc/cloudrun/source-preview-renderer \
            hyyc/cloudrun/source-preview-renderer/docker
          do
            npm ci --ignore-scripts --no-audit --prefix "$package"
          done
      - name: Static and environment contract checks
        working-directory: hyyc
        run: npm run check && npm run check:env && npm run check:database && npm run check:indexes
      - name: Unit and integration tests
        working-directory: hyyc
        run: npm test
      - name: Reject whitespace errors
        run: git diff --check

  production-dependencies:
    name: Production dependency locks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - hyyc/cloudfunctions/knowledgeFeed
          - hyyc/cloudfunctions/knowledgeOps
          - hyyc/cloudfunctions/membershipBilling
          - hyyc/cloudrun/source-preview-renderer
          - hyyc/cloudrun/source-preview-renderer/docker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Reproduce production install
        working-directory: ${{ matrix.package }}
        run: npm ci --ignore-scripts --no-audit --omit=dev

  release-gates:
    name: Coverage and dependency risk gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: |
            hyyc/cloudfunctions/knowledgeFeed/package-lock.json
            hyyc/cloudfunctions/knowledgeOps/package-lock.json
            hyyc/cloudfunctions/membershipBilling/package-lock.json
            hyyc/cloudrun/source-preview-renderer/package-lock.json
            hyyc/cloudrun/source-preview-renderer/docker/package-lock.json
      - name: Reproduce test dependencies
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            hyyc/cloudfunctions/knowledgeFeed \
            hyyc/cloudfunctions/knowledgeOps \
            hyyc/cloudfunctions/membershipBilling \
            hyyc/cloudrun/source-preview-renderer \
            hyyc/cloudrun/source-preview-renderer/docker
          do
            npm ci --ignore-scripts --no-audit --prefix "$package"
          done
      - name: Enforce coverage thresholds
        working-directory: hyyc
        run: npm run test:coverage
      - name: Audit production locks
        working-directory: hyyc
        run: npm run audit:production

  renderer-cold-start:
    name: Renderer browser cold starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: hyyc/cloudrun/source-preview-renderer/package-lock.json
      - name: Install CloudBase function runtime
        working-directory: hyyc/cloudrun/source-preview-renderer
        run: npm ci --ignore-scripts --no-audit --omit=dev
      - name: Verify browser versions
        working-directory: hyyc/cloudrun/source-preview-renderer
        run: npm run verify:runtimes
      - name: Launch a clean CloudBase Chromium instance
        working-directory: hyyc/cloudrun/source-preview-renderer
        run: npm run smoke:browser -- cloudbase-function
      - name: Build the pinned container
        working-directory: hyyc/cloudrun/source-preview-renderer
        run: docker build --pull=false -t source-preview-renderer:verify .
      - name: Launch a clean container Chromium instance
        run: docker run --rm --entrypoint node source-preview-renderer:verify scripts/browser-smoke.js docker
